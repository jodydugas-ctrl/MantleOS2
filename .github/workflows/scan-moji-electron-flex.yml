name: SCAN Moji Electron flexibility

on:
  push:
    branches:
      - scan/moji-electron-flex-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-moji:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOJI_COMMIT: 7793dbabc880a950b5003dcfd57c1222b279b807
      MOJI_TREE: b4e0e6a4d2010a6d584f40b01ab5ffad7bf18fea
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
      GEMINI_API_KEY: ''
      GROQ_API_KEY: ''
      MISTRAL_API_KEY: ''
      COHERE_API_KEY: ''

    steps:
      - name: Checkout adapted SCAN branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install scanner and scanner-owned TypeScript parser
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e Anchor/engine/v0.23 pytest
          mkdir -p .scan-tools
          npm install --prefix .scan-tools --ignore-scripts --no-package-lock --no-save typescript@5.7.2
          echo "SCAN_TYPESCRIPT_MODULE=$GITHUB_WORKSPACE/.scan-tools/node_modules/typescript" >> "$GITHUB_ENV"

      - name: Run SCAN regression suite
        shell: bash
        run: |
          pytest -q Anchor/engine/v0.23/tests

      - name: Checkout frozen Moji specimen
        uses: actions/checkout@v4
        with:
          repository: alexishida/Moji
          ref: 7793dbabc880a950b5003dcfd57c1222b279b807
          path: specimen
          fetch-depth: 1

      - name: Verify specimen identity
        shell: bash
        run: |
          test "$(git -C specimen rev-parse HEAD)" = "$MOJI_COMMIT"
          test "$(git -C specimen rev-parse HEAD^{tree})" = "$MOJI_TREE"
          printf '{"repository":"alexishida/Moji","commit":"%s","tree":"%s"}\n' "$MOJI_COMMIT" "$MOJI_TREE" > specimen_identity.json

      - name: Cold baseline scan without new adapters
        shell: bash
        run: |
          mkdir -p results
          python - <<'PY'
          from pathlib import Path
          from scan.engine import ScanEngine
          from scan.adapters import DEFAULT_ADAPTERS

          excluded = {"typescript-electron", "electron-metadata"}
          adapters = [a for a in DEFAULT_ADAPTERS if a.name not in excluded]
          ScanEngine(adapters=adapters).scan(
              Path("specimen"), Path("results/baseline"),
              specimen_id="alexishida/Moji@7793dbabc880a950b5003dcfd57c1222b279b807"
          )
          PY

      - name: Adapted cold scan
        shell: bash
        run: |
          scan-body scan specimen --out results/adapted-a --specimen-id "alexishida/Moji@$MOJI_COMMIT"

      - name: Fresh determinism rerun
        shell: bash
        run: |
          scan-body scan specimen --out results/adapted-b --specimen-id "alexishida/Moji@$MOJI_COMMIT"
          for f in machine_body_map.json evidence_graph.json evidence_catalog.json completeness_vector.json integrity_report.json surface_closure.json effect_closure.json nest_capability_map.json stage1_summary.md projection_manifest.json; do
            cmp "results/adapted-a/$f" "results/adapted-b/$f"
          done

      - name: Mechanical comparison and acceptance probes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(root, name):
              return json.loads((Path(root) / name).read_text(encoding="utf-8"))

          roots = {"baseline": "results/baseline", "adapted": "results/adapted-a"}
          out = {
              "schema_version": "scan-flexibility-comparison/0.1",
              "specimen": {"repository": "alexishida/Moji", "commit": "7793dbabc880a950b5003dcfd57c1222b279b807", "tree": "b4e0e6a4d2010a6d584f40b01ab5ffad7bf18fea"},
              "runs": {},
          }
          for key, root in roots.items():
              body = load(root, "machine_body_map.json")
              surface = load(root, "surface_closure.json")
              effect = load(root, "effect_closure.json")
              nest = load(root, "nest_capability_map.json")
              integrity = load(root, "integrity_report.json")
              out["runs"][key] = {
                  "files": body["inventory"]["file_count"],
                  "nodes": body["extraction"]["node_count"],
                  "edges": body["extraction"]["edge_count"],
                  "evidence": body["extraction"]["evidence_count"],
                  "findings": body["extraction"]["finding_count"],
                  "adapter_runs": body["extraction"]["adapter_runs"],
                  "surface_closure": {k: surface.get(k) for k in ("state", "surface_count", "bound_count", "partial_count", "unresolved_count", "closure_ratio")},
                  "effect_closure": {k: effect.get(k) for k in ("state", "surface_count", "closed_count", "partial_count", "unresolved_count", "feedback_observed_count", "closure_ratio")},
                  "nest": {k: nest.get(k) for k in ("state", "capability_count", "effect_count", "boundary_count", "persistence_object_count")},
                  "integrity": {k: integrity.get(k) for k in ("state", "issue_count", "severity_counts")},
              }

          b = out["runs"]["baseline"]
          a = out["runs"]["adapted"]
          out["delta"] = {
              "nodes": a["nodes"] - b["nodes"],
              "edges": a["edges"] - b["edges"],
              "evidence": a["evidence"] - b["evidence"],
              "human_surfaces": a["surface_closure"]["surface_count"] - b["surface_closure"]["surface_count"],
              "bound_surfaces": a["surface_closure"]["bound_count"] - b["surface_closure"]["bound_count"],
              "closed_effect_routes": a["effect_closure"]["closed_count"] - b["effect_closure"]["closed_count"],
              "nest_effects": a["nest"]["effect_count"] - b["nest"]["effect_count"],
              "nest_boundaries": a["nest"]["boundary_count"] - b["nest"]["boundary_count"],
          }
          out["determinism"] = "PASS"
          Path("results/FLEXIBILITY_COMPARISON.json").write_text(json.dumps(out, indent=2), encoding="utf-8")
          print(json.dumps(out["delta"], indent=2))
          PY

          scan-body query results/adapted-a/scan_index.sqlite surfaces-without-handlers --limit 200 > results/query_surfaces_without_handlers.json
          scan-body query results/adapted-a/scan_index.sqlite external-writes --limit 200 > results/query_external_writes.json
          scan-body query results/adapted-a/scan_index.sqlite nest-dependent-actions --limit 200 > results/query_nest_dependent_actions.json
          scan-body query results/adapted-a/scan_index.sqlite unknown-routes --limit 200 > results/query_unknown_routes.json

      - name: Add experiment receipt and patch snapshot
        shell: bash
        run: |
          mkdir -p results/scanner-patch
          cp Anchor/engine/v0.23/scan/adapters/typescript_electron.py results/scanner-patch/
          cp Anchor/engine/v0.23/scan/adapters/ts_probe.cjs results/scanner-patch/
          cp specimen_identity.json results/
          cat > results/EXPERIMENT_RECEIPT.md <<'EOF'
          # SCAN Moji Electron flexibility experiment

          This run compares the frozen SCAN v0.23 default adapters against the same scanner with generic TypeScript/React/Electron adapters enabled.

          Specimen: `alexishida/Moji@7793dbabc880a950b5003dcfd57c1222b279b807`
          Tree: `b4e0e6a4d2010a6d584f40b01ab5ffad7bf18fea`

          The TypeScript probe is scanner-owned and parse-only. It does not import or execute specimen modules. Moji dependencies are not installed and Moji build/dev scripts are not run. LLM credentials are blank during scanning.

          `baseline/` is v0.23 with the new adapters excluded. `adapted-a/` is the adapted scan. `adapted-b/` is a fresh unchanged rerun used to verify byte-identical canonical projections.
          EOF

      - name: Upload full evidence package
        uses: actions/upload-artifact@v4
        with:
          name: moji-anchor-scan-flex-test
          path: results
          if-no-files-found: error
          retention-days: 14
