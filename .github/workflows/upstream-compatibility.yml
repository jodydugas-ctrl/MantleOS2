name: Weekly upstream compatibility

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: mantle assimilate github.com/nousresearch/hermes-agent --destination .assimilation-work/hermes-agent
      - run: python scripts/verify_hermes_delta.py .assimilation-work/hermes-agent
      - run: python -m compileall -q .assimilation-work/hermes-agent
