name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --junitxml=test-results.xml
      - run: python -m mantleos.public_audit .
      - name: Resolve certified Hermes commit
        id: lock
        shell: python
        run: |
          import json
          import os
          commit = json.load(open("examples/hermes/upstream.lock.json", encoding="utf-8"))["commit"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"commit={commit}\n")
      - run: mantle assimilate github.com/nousresearch/hermes-agent --ref "${{ steps.lock.outputs.commit }}" --destination .assimilation-work/hermes-agent
      - run: python scripts/verify_hermes_delta.py .assimilation-work/hermes-agent --expected-commit "${{ steps.lock.outputs.commit }}"
      - run: python -m build
      - run: python scripts/build_release.py .assimilation-work/hermes-agent .artifacts --test-report test-results.xml
      - name: Publish immutable prerelease artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --prerelease --generate-notes dist/* .artifacts/*
