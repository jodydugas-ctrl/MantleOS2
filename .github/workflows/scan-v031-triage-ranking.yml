name: SCAN v0.31 triage ranking

on:
  push:
    branches:
      - scan-v0.31-triage-ranking
    paths:
      - 'Anchor/engine/v0.31/**'
      - '.github/workflows/scan-v031-triage-ranking.yml'
  pull_request:
    paths:
      - 'Anchor/engine/v0.31/**'
      - '.github/workflows/scan-v031-triage-ranking.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      GOOGLE_API_KEY: ''
      GEMINI_API_KEY: ''
      GROQ_API_KEY: ''
      MISTRAL_API_KEY: ''
      COHERE_API_KEY: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install v0.31 candidate
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e Anchor/engine/v0.31
          mkdir -p .scan-tools
          npm install --prefix .scan-tools --ignore-scripts --no-package-lock --no-save typescript@5.7.2
          echo "SCAN_TYPESCRIPT_MODULE=$GITHUB_WORKSPACE/.scan-tools/node_modules/typescript" >> "$GITHUB_ENV"
          python - <<'PY'
          import scan
          assert scan.__version__ == "0.31.0", scan.__version__
          PY
          test ! -f Anchor/engine/v0.31/PACKAGE_MANIFEST.json

      - name: Run full candidate regression suite
        shell: bash
        run: pytest -q Anchor/engine/v0.31/tests

      - name: Prove deterministic scan-time triage output
        shell: bash
        run: |
          scan-body scan Anchor/engine/v0.31/tests/fixtures/qualification_sample --out results/a --specimen-id v031-triage-fixture
          scan-body scan Anchor/engine/v0.31/tests/fixtures/qualification_sample --out results/b --specimen-id v031-triage-fixture
          for f in coverage_report.json gaps.json uncertainty_challenges.json triage_ranking.json triage_ranking.md projection_manifest.json; do
            cmp "results/a/$f" "results/b/$f"
          done

      - name: Prove read-only triage regeneration
        shell: bash
        run: |
          sha256sum results/a/scan_index.sqlite > results/db.before
          scan-body triage-gaps results/a/scan_index.sqlite --out-dir results/regenerated
          sha256sum results/a/scan_index.sqlite > results/db.after
          cmp results/db.before results/db.after
          cmp results/a/triage_ranking.json results/regenerated/triage_ranking.json
          cmp results/a/triage_ranking.md results/regenerated/triage_ranking.md

      - name: Audit ranking transparency and authority boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("results/a/triage_ranking.json").read_text())
          gaps = json.loads(Path("results/a/gaps.json").read_text())

          assert report["ranked_count"] == gaps["gap_count"]
          assert report["authority"]["projection_only"] is True
          assert report["authority"]["importance_not_truth"] is True
          assert report["authority"]["confidence_effect"] == "NONE"
          assert report["authority"]["promotion_effect"] == "NONE"
          assert report["authority"]["canonical_write_allowed"] is False
          assert report["ranking_policy"]["state_used_as_weight"] is False
          assert report["ranking_policy"]["category_used_as_weight"] is False
          assert report["ranking_policy"]["maximum_score"] == 100

          last = None
          for index, row in enumerate(report["rankings"], start=1):
              assert row["rank"] == index, row
              assert row["investigation_score"] == sum(row["components"].values()), row
              assert 0 <= row["investigation_score"] <= 100, row
              assert row["importance_only"] is True
              assert row["confidence_effect"] == "NONE"
              assert row["promotion_effect"] == "NONE"
              assert row["canonical_write_allowed"] is False
              if last is not None:
                  assert last >= row["investigation_score"], row
              last = row["investigation_score"]
          PY

      - name: Upload v0.31 triage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-v031-triage-ranking
          path: results
          if-no-files-found: error
          retention-days: 14
